name: scanserve
description: "ScanServe - Digital QR Menu + Table Ordering System"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0
  flutter_web_plugins:
    sdk: flutter

  # Networking
  dio: ^5.5.0

  # Persists the JWT across page reloads (uses localStorage on web)
  shared_preferences: ^2.2.3

  # Web platform APIs (replaces deprecated dart:html)
  web: ^1.0.0

  # Menu item image picking (Phase 4) - works on Flutter Web via the
  # browser's file picker under the hood
  image_picker: ^1.1.2

  # Real-time order events (Phase 7) - connects to the same backend the
  # Dio client talks to, just without the "/api" path (see
  # core/network/socket_client.dart)
  socket_io_client: ^2.0.3+1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
